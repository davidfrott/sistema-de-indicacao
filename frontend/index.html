<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Indicação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="page-login">
            <h1>Entrar</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-senha" required>
                        <button type="button" id="toggle-login-password" class="toggle-password-btn" aria-label="Mostrar/Ocultar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">Entrar</button>
                <p id="login-error" class="error-message"></p>
            </form>
            <p class="switcher">Não tem uma conta? <a href="#" id="show-register">Cadastre-se</a></p>
        </section>

        <section id="page-register" class="hidden">
            <h1>Crie sua Conta</h1>
            <form id="register-form">
                <div class="form-group">
                    <label for="nome">Nome de Usuário</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" minlength="8" required>
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar/Ocultar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">Cadastrar</button>
                <p id="register-error" class="error-message"></p>
            </form>
            <p class="switcher">Já tem uma conta? <a href="#" id="show-login">Faça Login</a></p>
        </section>

        <section id="page-profile" class="hidden">
            <h1>Seu Perfil</h1>
            <div class="profile-info">
                <p><strong>Usuário:</strong> <span id="profile-nome"></span></p>
                <p><strong>Pontuação Atual:</strong> <span id="profile-pontuacao"></span></p>
                <p><strong>Seu Link de Indicação:</strong></p>
                <div class="referral-box">
                    <input type="text" id="profile-link" readonly>
                    <button id="copy-link-button">Copiar Link</button>
                </div>
                 <p id="copy-success" class="success-message"></p>
            </div>
            <button id="logout-button" class="logout">Sair</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
